services:
  # ---------------------------------------------------------------
  # Postgres — primary database (persistent volume)
  # ---------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: ai4sids-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ai4sids}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ai4sids}
      - POSTGRES_DB=${POSTGRES_DB:-ai4sids_gov}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai4sids} -d ${POSTGRES_DB:-ai4sids_gov}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------
  # Data Backend API — simulated sensor, river, social media data
  # ---------------------------------------------------------------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ai4sids-api
    environment:
      - ENABLE_BACKGROUND_TASK=true
      - DATA_CYCLE_INTERVAL=15 # seconds
      # Defaults to the postgres service; override DATABASE_URL to use
      # sqlite (e.g. sqlite:////app/db/ai4sids_demo.db) for local runs.
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-ai4sids}:${POSTGRES_PASSWORD:-ai4sids}@db:5432/${POSTGRES_DB:-ai4sids_gov}}
      # Auth — set real values in the Dokploy/staging environment.
      - SECRET_KEY=${SECRET_KEY:-changeme-please-set-a-real-secret-in-env}
      - SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL:-admin@ai4sids.org}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD:-change-me-now}
      - SEED_DEMO_ORGS=${SEED_DEMO_ORGS:-false}
    volumes:
      - api-db:/app/db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/locations"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------
  # RAG Service — distributed agents + OpenAI-compatible API
  # ---------------------------------------------------------------
  rag:
    build:
      context: ./rag
      dockerfile: Dockerfile
    container_name: ai4sids-rag
    environment:
      # Backend URL inside Docker network
      - DATA_BACKEND_URL=http://api:8080
      # Local Ollama (model is pulled automatically by the ollama-pull service).
      # Override the model by setting LLM_MODEL in the root .env / Dokploy env.
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=${LLM_MODEL:-llama3.2}
      #
      # Alternative backends (set these to override Ollama — see rag/config/settings.py priority):
      # - OPENAI_API_BASE_URL=https://their-openwebui-url.com/api
      # - OPENAI_API_KEY=sk-their-key
      # - NVIDIA_API_KEY=nvapi-...
    volumes:
      - ./rag/data:/app/data
      - ./rag/logs:/app/logs
    depends_on:
      api:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------
  # Frontend — React dashboard
  # ---------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # These are baked into the browser bundle at build time.
        # Set DOMAIN in the root .env file before running docker compose up --build.
        # DOMAIN must be the public hostname/IP the user's browser uses to reach this server.
        - VITE_API_URL=http://${DOMAIN}/api
        - VITE_CHAT_API_BASE_URL=http://${DOMAIN}/rag
        - VITE_BASE_URL=http://${DOMAIN}
    container_name: ai4sids-frontend
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Open WebUI — chat interface for the RAG (optional)
  # Uncomment this if you want a chat UI for the RAG service.
  # ---------------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ai4sids-webui
    environment:
      - OPENAI_API_BASE_URL=http://rag:8000/v1
      - OPENAI_API_KEY=not-needed
      - WEBUI_NAME=AI4SIDS Climate Assistant
      - DEFAULT_MODELS=ai4sids-climate-assistant
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      rag:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Nginx — reverse proxy (single public entry point on port 80)
  # ---------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: ai4sids-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api
      - rag
      - open-webui
    restart: unless-stopped

  # ---------------------------------------------------------------
  # Ollama — local LLM provider
  # The GPU reservation below requires the NVIDIA Container Toolkit
  # (present on AWS GPU instances / Deep Learning AMIs). Comment out
  # the deploy: block to run CPU-only on machines without a GPU.
  # ---------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ai4sids-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------
  # Ollama model pull — one-shot job that downloads the model into
  # the shared ollama_data volume, then exits. The rag service waits
  # for it, so the model is always present before the RAG starts.
  # ---------------------------------------------------------------
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ai4sids-ollama-pull
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${LLM_MODEL:-llama3.2}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
    driver: local
  api-db:
    driver: local
  open-webui-data:
    driver: local
  ollama_data:
    driver: local

networks:
  app-network:
  dokploy-network:
    external: true
